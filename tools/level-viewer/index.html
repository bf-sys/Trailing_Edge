<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trailing Edge — Level Viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        color: #e8e8ec;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px;
        background: #14171f;
        border-bottom: 1px solid #2a2e3a;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #cfd3dc;
        white-space: nowrap;
      }
      select,
      button {
        background: #1d212b;
        color: #e8e8ec;
        border: 1px solid #333846;
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 13px;
      }
      select:hover,
      button:hover {
        border-color: #4b5468;
        cursor: pointer;
      }
      #meta {
        font-size: 12px;
        color: #9aa0ae;
        white-space: nowrap;
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #canvasWrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #05060a;
      }
      canvas {
        display: block;
        cursor: grab;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      #coord,
      #hint {
        position: absolute;
        font-size: 11px;
        color: #8892a6;
        background: #00000090;
        padding: 3px 7px;
        border-radius: 3px;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
      }
      #coord {
        bottom: 8px;
        left: 8px;
      }
      #hint {
        bottom: 8px;
        right: 8px;
      }
      aside {
        width: 260px;
        flex-shrink: 0;
        overflow-y: auto;
        background: #12141b;
        border-left: 1px solid #2a2e3a;
        padding: 12px 14px;
        font-size: 12px;
      }
      aside h2 {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: #7c8497;
        margin: 16px 0 6px;
        font-weight: 700;
      }
      aside h2:first-child {
        margin-top: 0;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 2px;
        border-radius: 3px;
        cursor: pointer;
        user-select: none;
      }
      .legend-row:hover {
        background: #1c1f29;
      }
      .legend-row input {
        margin: 0;
        flex-shrink: 0;
      }
      .swatch {
        width: 12px;
        height: 12px;
        flex-shrink: 0;
        border: 1px solid #00000066;
        box-sizing: border-box;
      }
      .swatch.circle {
        border-radius: 50%;
      }
      .swatch.path {
        border-radius: 2px;
        border-style: dashed;
      }
      .legend-label {
        flex: 1;
        color: #d4d8e0;
      }
      .legend-row.zero .legend-label {
        color: #565c6b;
      }
      .legend-count {
        color: #6b7280;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }
      #objectivePath {
        margin: 4px 2px 0;
        font-size: 11px;
        color: #7c8497;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Level Viewer</h1>
        <select id="levelSelect"></select>
        <span id="meta"></span>
        <span style="flex: 1"></span>
        <button id="resetView">Reset view</button>
      </header>
      <main>
        <div id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div id="coord"></div>
          <div id="hint">scroll = zoom &middot; drag = pan</div>
        </div>
        <aside id="legend"></aside>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
