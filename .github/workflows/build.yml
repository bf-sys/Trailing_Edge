name: Build & Publish to itch.io

# Manual trigger only, for now — see docs/reference/butler-ci-guide.md.
# Nothing here runs on a push; you have to click "Run workflow" on the
# Actions tab (or `gh workflow run build.yml`) every time.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the build to itch.io via butler"
        type: boolean
        default: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set build ID
        # Auto-incrementing per run (github.run_number), plus a short commit
        # SHA -- read by vite.config.ts's `define` and shown on the title
        # screen so a stale cached itch.io build can be told apart from an
        # actual regression at a glance.
        run: echo "BUILD_ID=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build (tsc --noEmit && vite build)
        run: npm run build

      - name: Upload dist/ as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

      - name: Install butler
        if: ${{ inputs.publish }}
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler
          chmod +x butler/butler
          ./butler/butler -V

      - name: Push to itch.io
        if: ${{ inputs.publish }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/butler push dist deathpig-jones/trailing-edge:html5
